name: Continuous Integration Udyam Extractor

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python files
        run: |
          python -m py_compile config.py udyam_extractor.py run_udyam.py

      - name: Run tests
        run: python -m pytest -q

      - name: Validate dbt project
        run: |
          pip install "dbt-snowflake>=1.12" --quiet
          python -c "
          import os, pathlib
          p = pathlib.Path.home() / '.dbt'
          p.mkdir(exist_ok=True)
          (p / 'profiles.yml').write_text(
              'udyam_dbt:\n  target: ci\n  outputs:\n    ci:\n      type: snowflake\n      account: dummy\n      user: dummy\n      password: dummy\n      role: dummy\n      warehouse: dummy\n      database: UDYAM\n      schema: RAW\n      threads: 1\n'
          )
          "
          cd udyam_dbt && dbt parse
