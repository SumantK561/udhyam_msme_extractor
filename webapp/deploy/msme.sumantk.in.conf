server {
    listen 80;
    server_name msme.sumantk.in;

    root /home/ubuntu/udhyam_msme_extractor/webapp/frontend;
    index index.html;

    location /api/ {
        limit_req zone=msme_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
