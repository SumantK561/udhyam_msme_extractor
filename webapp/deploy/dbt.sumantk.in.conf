server {
    listen 80;
    server_name dbt.sumantk.in;

    # dbt docs generate outputs index.html + catalog.json + manifest.json here
    root /home/ubuntu/udhyam_msme_extractor/udyam_dbt/target;
    index index.html;

    # dbt docs SPA: all routes served from index.html; JSON assets served as-is
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Allow large JSON catalog files (can be several MB)
    location ~* \.(json)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }
}
