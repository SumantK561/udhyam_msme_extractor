<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Udyam MSME Search</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Udyam MSME Directory</h1>
    <p class="subtitle">Search 37M+ registered MSME enterprises across India</p>
  </header>

  <main>
    <form id="search-form">
      <div class="field">
        <label for="name">Enterprise name</label>
        <input type="text" id="name" placeholder="e.g. Sri Ram Traders" minlength="2" />
      </div>

      <div class="field">
        <label for="state">State</label>
        <select id="state">
          <option value="">All states</option>
        </select>
      </div>

      <div class="field">
        <label for="district">District</label>
        <select id="district" disabled>
          <option value="">All districts</option>
        </select>
      </div>

      <div class="field">
        <label for="nic_code">Industry (NIC code)</label>
        <select id="nic_code">
          <option value="">All industries</option>
        </select>
      </div>

      <button type="submit">Search</button>
    </form>

    <p id="status" class="status"></p>

    <table id="results-table" class="hidden">
      <thead>
        <tr>
          <th>Enterprise Name</th>
          <th>State</th>
          <th>District</th>
          <th>Pincode</th>
          <th>Registration Date</th>
        </tr>
      </thead>
      <tbody id="results-body"></tbody>
    </table>

    <div id="pagination" class="pagination hidden">
      <button id="prev-page">&larr; Previous</button>
      <span id="page-label">Page 1</span>
      <button id="next-page">Next &rarr;</button>
    </div>
  </main>

  <div id="detail-modal" class="modal hidden">
    <div class="modal-content">
      <button id="close-modal" class="close-btn">&times;</button>
      <h2 id="detail-name"></h2>
      <p id="detail-address"></p>
      <p id="detail-location"></p>
      <p id="detail-registration"></p>
      <h3>NIC Activities</h3>
      <ul id="detail-activities"></ul>
    </div>
  </div>

  <footer>
    <p>Source: Government of India Udyam Registration data (data.gov.in). Updated weekly.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
